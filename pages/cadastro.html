<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <form class="form-ViaCEP">
        <fieldset class="container-form">
            <h1 class="title-form-ViaCEP">Formulário de cadastro do <a class="Via-CEP" href="../pages/index.html">ViaCEP</a></h1>
            <label for="email" class="label-email">Email</label>
            <input type="text" name="email" id="email">
            <label for="password" class="label-password">Senha</label>
            <input type="password" name="password" id="password">
            <input type="submit" value="Cadastrar" class="btn btn-form">
            <p class="message"></p>
            <p class="redirect-description"> Fazer login
                <a href="./login.html">Entrar</a>
            </p>
            <p class="password-reset">Esqueceu a senha? <a href="#">Clique aqui</a></p>
        </fieldset>
    </form>

    <script type="module" src="../js/userSingUp.js"></script>
</body>
</html>
