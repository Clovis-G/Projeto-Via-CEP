<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <form class="form-ViaCEP">
            <fieldset class="container-form custom-border">
                <h1 class="title-form-ViaCEP">Formulário de login do <a href="../pages/index.html" class="Via-CEP">ViaCEP</a></h1>
                <label for="email" class="label-email">Email</label>
                <input type="text" name="email" id="email">
                <label for="password" class="label-password">Senha</label>
                <input type="password" name="password" id="password">
                <input type="submit" value="Entrar" class="btn btn-form">
                <p class="message"></p>
                <p class="redirect-description">Registre-se aqui <a href="../pages/cadastro.html">Cadastre-se</a></p>
            </fieldset>
    </form>
    <script type="module" src="../js/userLogin.js"></script>
</body>
</html>
